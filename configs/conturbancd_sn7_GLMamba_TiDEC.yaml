_BASE_: "base.yaml"
SEED: 2
NAME: "conturbancd_sn7_GLMamba_TGatev2"

TRAINER:
  LR: 1e-4
  BATCH_SIZE: 2
  EPOCHS: 30
  PRETRAINED: True
  # TiDEC 对比学习超参（NUM_SAMPLES 越小越省显存）
  NUM_SAMPLES: 128
  LAMBDA_AUG: 1.0
  LAMBDA_STABLE: 0.5
  STABLE_RATIO: 0.5
  AUG_BRIGHTNESS: 0.2
  AUG_CONTRAST: 0.2

AUGMENTATION:
  CROP_SIZE: 64
  EVAL_PATCH_SIZE: 64

MODEL:
  EDGE_TYPE: 'dense'
  TYPE: 'mtunetformer_glmamba'
  USE_MAMBA: True

DATASET:
  NAME: 'sn7'

DATALOADER:
  TIMESERIES_LENGTH: 12
