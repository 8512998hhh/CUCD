_BASE_: "base.yaml"
SEED: 2
NAME: "conturbancd_sn7_GLMamba_CT"

TRAINER:
  LR: 1e-4
  BATCH_SIZE: 6
  PRETRAINED: False
  EPOCHS: 50
AUGMENTATION:
  CROP_SIZE: 64
  EVAL_PATCH_SIZE: 64


MODEL:
  EDGE_TYPE: 'dense'
  TYPE: 'mtunetformer_glmamba'
  USE_MAMBA: True
  # 🚀 连续时间离散化开关：Δ_eff = softplus(dt_proj(x)+b) · Δt_norm
  # 关闭此项即回退到原 GLMamba 模型（GLMambaTFRModule 乘性时间门控）
  USE_CONTINUOUS_TIME: True
  # 时间间隔归一化尺度：Δt_norm = Δt(月) / TS_SCALE
  # TS_SCALE 越小，时间调制越强；若训练后 CT 与 baseline 差异不明显可减小此值
  TS_SCALE: 1.0
  # 局部窗口大小，与原 GLSSM 默认一致
  CT_WINDOW_SIZE: 6

DATASET:
  NAME: 'sn7'

DATALOADER:
  TIMESERIES_LENGTH: 12
